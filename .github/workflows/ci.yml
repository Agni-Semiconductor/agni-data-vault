# The gate the parity and contract tests were written to be.
#
# 123 commits merged into main on 2026-09-16 with nothing running them first. The suite includes
# tests that exist precisely to catch drift a human review misses -- env vars documented but never
# read, connect views exposing a forbidden column, a deploy unit with no timer -- and a test that is
# not run on the pull request is a test that runs after the mistake is on main.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      # Several suites spawn bash for the deploy scripts; ubuntu-latest has it, and the scripts
      # under test are the same files that run on edaserver.
      - name: test
        run: npx vitest run
        env:
          CI: 'true'

      - name: build
        run: npm run build
